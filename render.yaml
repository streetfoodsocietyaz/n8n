# Deploys n8n on Render as a web service that stores
# workflow data in a Render Postgres database.
#
# Both the web service and the database use paid instance
# types (set by `plan`), so the service never sleeps and
# the database is not deleted after 30 days.

services:
  - type: web
    plan: 1c-2g
    # Runtime for services that pull a prebuilt Docker image
    runtime: image
    name: n8n-service
    image:
      # Pinned to a specific stable version so a redeploy can't
      # silently upgrade n8n. Change this number on purpose when
      # you want to upgrade.
      url: docker.io/n8nio/n8n:2.36.9

    envVars:
      # Generates a key for encrypting saved credentials.
      # Do not modify this value after it's generated!
      # Losing it means re-entering every login.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Port Render should route traffic to
      - key: PORT
        value: "5678"

      # SFS runs on Arizona time (no daylight saving)
      - key: GENERIC_TIMEZONE
        value: America/Phoenix
      - key: TZ
        value: America/Phoenix

      # Render puts one proxy in front of the service
      - key: N8N_PROXY_HOPS
        value: "1"

      # These populate connection details for the Render
      # Postgres database defined below
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: 0.1c-256mb
    # Disk can be increased in multiples of 5 GB by setting
    # `diskSizeGB` if the database ever fills up.
    #
    # diskSizeGB: 5
